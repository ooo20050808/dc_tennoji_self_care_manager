{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>削除確認</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container confirm-container">
        <h1>ユーザー削除の確認画面</h1>
        <p>以下のユーザーを削除しますか？</p>
        <p><strong>{{ target_user.user_name }}</strong> ({{ target_user.email }})</p>

        <form method="post" class="form-actions">
            {% csrf_token %}
            <button type="submit" name="action" value="confirm" class="button button-primary">削除</button>
            <button type="submit" name="action" value="back" class="button button-secondary">キャンセル</button>
        </form>
         <div class="button-row">
            <a href="{% url 'selfCare:admin_screen' %}" class="button button-primary">管理者画面に戻る</a>
        </div>
    </div>
</body>
</html>
