{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編集完了</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container confirm-container">
        <h1>編集完了画面</h1>

        <div class="confirm-data">
            <p>ユーザー情報が正常に編集されました。</p>
        </div>

        <div class="button-column">
            <a href="{% url 'selfCare:user_list' %}?from=complete" class="button button-primary">ユーザーリストに戻る</a>
            <a href="{% url 'selfCare:admin_screen' %}" class="button button-primary">管理者画面に戻る</a>
            <form action="{% url 'selfCare:logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="button button-secondary">ログアウト</button>
            </form>
        </div>
    </div>
</body>
</html>
