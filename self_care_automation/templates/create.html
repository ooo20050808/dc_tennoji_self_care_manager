{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規ユーザー作成</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        <h1>新規ユーザー作成画面</h1>

        <form method="post" class="form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <ul class="errorlist">
                            {% for error in field.errors %}
                                <li>{{ error }}</li>
                            {% endfor %}
                        </ul>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="button button-primary">確認画面へ</button>
        </form>

        <!-- ボタンを中央配置するためのコンテナ（リンクをボタン風・中央揃えにする） -->
        <div class="button-column">
            <a href="{% url 'selfCare:admin_screen' %}" class="button button-primary">管理者画面に戻る</a>
            <a href="{% url 'selfCare:user_list' %}" class="button button-secondary">ユーザーリストに戻る</a>
        </div>
    </div>
</body>
</html>
