{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー認証</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">

        <h1>利用者認証画面</h1>
        <h1>{{ title }}</h1>
        <p class="description">
            {% if action == 'delete' %}
                削除を行うために、削除されるユーザーの情報を再度入力してください。
            {% else %}
                編集を行うために、編集されるユーザーの情報を再度入力してください。
            {% endif %}
        </p>

        {% if error_message %}
            <p class="error-message">{{ error_message }}</p>
        {% endif %}

       <form action="" method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button type="submit" class="button button-primary">認証</button>
                <a href="{% url 'selfCare:admin_screen'%}" class="button button-secondary">管理者画面に戻る</a>
            </div>
        </form>
    </div>
</body>
</html>
